<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>専門書・実務書 瞬殺スキャナー</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #0284c7;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.15rem; margin: 4px 0 12px; text-align: center; font-weight: 700; color: #38bdf8; }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
    }
    .btn-camera { background-color: var(--primary); color: #fff; margin-bottom: 8px; }
    .btn-add { background-color: #334155; color: #38bdf8; border: 1px dashed #38bdf8; margin-top: 8px; }
    .btn-mercari { background-color: #ef4444; color: #fff; margin-top: 10px; text-decoration: none; border-radius: 8px; }
    .btn-reset { background-color: transparent; color: var(--text-sub); border: 1px solid var(--border); margin-top: 6px; padding: 6px; font-size: 0.85rem; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    .btn-manual { width: 70px; background-color: var(--info); color: #fff; padding: 0; }
    
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.78rem;
    }
    .checkbox-grid label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    
    .book-item {
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
    }
    .book-item:last-child { border-bottom: none; }
    .badge-rank {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .rank-S { background-color: #10b981; color: white; }
    .rank-A { background-color: #3b82f6; color: white; }
    .rank-B { background-color: #eab308; color: black; }
    .rank-C { background-color: #f97316; color: white; }
    .rank-D { background-color: #ef4444; color: white; }

    .alert-box {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: #fbbf24;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      margin-top: 6px;
    }
    .calc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 0.9rem;
    }
    .calc-input {
      width: 90px;
      padding: 6px;
      text-align: right;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
    }
    .profit-display {
      font-size: 1.15rem;
      font-weight: bold;
      text-align: right;
      margin-top: 8px;
    }
    .profit-plus { color: #10b981; }
    .profit-minus { color: #ef4444; }
  </style>
</head>
<body>
<div class="container">
  <h1>専門書・実務書 瞬殺スキャナー</h1>

  <div class="card">
    <button class="btn-camera" id="btn-scan" onclick="toggleCamera()">📷 バーコードスキャナー起動</button>
    <div id="reader"></div>

    <div class="input-group">
      <input type="text" id="isbn-input" placeholder="ISBN (978...)" maxlength="13">
      <button class="btn-manual" onclick="manualSearch()">査定</button>
    </div>

    <div class="checkbox-grid">
      <label style="color:#38bdf8"><input type="checkbox" id="chk-latest" onchange="recalculate()">最新版と確認済</label>
      <label><input type="checkbox" id="chk-line" onchange="recalculate()">解説に線引き/マーカー</label>
      <label style="color:#ef4444"><input type="checkbox" id="chk-write" onchange="recalculate()">過去問/問題に書込み</label>
      <label style="color:#ef4444"><input type="checkbox" id="chk-cd" onchange="recalculate()">解答/コード/必須CD欠損</label>
      <label><input type="checkbox" id="chk-lib" onchange="recalculate()">図書館除籍本(印/シール)</label>
      <label><input type="checkbox" id="chk-minor" onchange="recalculate()">軽微な付属欠品</label>
    </div>
  </div>

  <!-- 結果表示エリア -->
  <div class="card" id="result-card" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="rank-badge" class="badge-rank rank-D">D (判定待機)</span>
      <span id="set-badge" style="font-size:0.8rem; color:#38bdf8; font-weight:bold;">1冊単体モード</span>
    </div>

    <!-- スキャンされた本リスト -->
    <div id="books-container"></div>

    <!-- 複数冊スキャン追加ボタン -->
    <button class="btn-add" onclick="startAddScan()">＋ もう1冊追加してセット査定</button>

    <!-- アラート表示 -->
    <div id="alert-container"></div>

    <!-- 収支シミュレーション -->
    <div style="margin-top:12px; border-top:1px dashed var(--border); padding-top:10px;">
      <div style="font-size:0.85rem; font-weight:bold; color:#94a3b8;">合計収支シミュレーション</div>
      <div class="calc-row">
        <span>想定売価(合計):</span>
        <input type="number" id="input-sell" class="calc-input" oninput="manualRecalc()">
      </div>
      <div class="calc-row">
        <span>仕入れ合計(店頭値札):</span>
        <input type="number" id="input-cost" class="calc-input" value="550" oninput="manualRecalc()">
      </div>
      <div class="calc-row" style="font-size:0.78rem; color:var(--text-sub);">
        <span>送料目安 (<span id="shipping-type">ゆうパケ215円</span>):</span>
        <span id="shipping-cost">215 円</span>
      </div>

      <div id="profit-result" class="profit-display profit-plus">純利益: 0 円 (0%)</div>
    </div>

    <a id="btn-mercari-link" class="btn-mercari" href="#" target="_blank" rel="noopener noreferrer">🔍 メルカリ成約相場(Sold)を1秒確認</a>
    <button class="btn-reset" onclick="resetAll()">✕ クリアして最初に戻る</button>
  </div>
</div>

<script>
let scannedBooks = [];
let html5QrCode = null;
let isCameraActive = false;

// 出版社別残価率
const PUB_RATES = {
  "医学書院": 0.70, "南江堂": 0.70, "へるす出版": 0.70, "辰已法律研究所": 0.70,
  "有斐閣": 0.70, "弘文堂": 0.70, "日本加除出版": 0.70, "商事法務": 0.70,
  "中央法規出版": 0.70, "全国社会福祉協議会": 0.70, "明石書店": 0.70, "ミネルヴァ書房": 0.70,
  "金剛出版": 0.70, "金子書房": 0.70, "誠信書房": 0.70, "星和書店": 0.70,
  "創元社": 0.70, "岩崎学術出版社": 0.70, "北大路書房": 0.70, "オライリー・ジャパン": 0.70,
  "みすず書房": 0.65, "岩波書店": 0.65, "東京大学出版会": 0.65, "吉川弘文館": 0.65, "青土社": 0.65,
  "TAC出版": 0.65, "技術評論社": 0.55, "翔泳社": 0.55, "日経BP": 0.55, "オーム社": 0.55
};

function toggleCamera() {
  if (isCameraActive) {
    stopCamera();
  } else {
    startCamera();
  }
}

function startCamera() {
  const reader = document.getElementById("reader");
  reader.style.display = "block";
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      if (decodedText.startsWith("978") && decodedText.length === 13) {
        stopCamera();
        fetchBookData(decodedText);
      }
    },
    (errorMessage) => {}
  ).catch(err => {
    alert("カメラ起動に失敗しました: " + err);
    reader.style.display = "none";
  });
  isCameraActive = true;
  document.getElementById("btn-scan").textContent = "⏹ スキャナー停止";
}

function stopCamera() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      document.getElementById("reader").style.display = "none";
      isCameraActive = false;
      document.getElementById("btn-scan").textContent = "📷 バーコードスキャナー起動";
    });
  }
}

function startAddScan() {
  startCamera();
}

function manualSearch() {
  const isbn = document.getElementById("isbn-input").value.trim();
  if (isbn.length === 13 && isbn.startsWith("978")) {
    fetchBookData(isbn);
  } else {
    alert("正しい13桁のISBN(978...)を入力してください");
  }
}

async function fetchBookData(isbn) {
  try {
    const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
    const data = await res.json();
    if (!data || !data[0]) {
      alert("書誌情報が見つかりませんでした (OpenBD未登録)");
      return;
    }
    const b = data[0].summary;
    const book = {
      isbn: isbn,
      title: b.title || "不明",
      publisher: b.publisher || "不明",
      pubdate: b.pubdate || "",
      price: b.price ? parseInt(b.price, 10) : 0
    };
    scannedBooks.push(book);
    updateUI();
  } catch (e) {
    alert("通信エラーが発生しました");
  }
}

function updateUI() {
  document.getElementById("result-card").style.display = "block";
  document.getElementById("set-badge").textContent = scannedBooks.length > 1 ? `セットモード (${scannedBooks.length}冊合算)` : "1冊単体モード";

  const container = document.getElementById("books-container");
  container.innerHTML = "";

  let totalDefPrice = 0;
  let hasSetKeywords = false;
  let hasOldBookWarning = false;
  let currentYear = new Date().getFullYear();

  scannedBooks.forEach((book, idx) => {
    totalDefPrice += book.price;
    
    // 発行年解析
    let pubYearText = "不明";
    let isOld = false;
    if (book.pubdate && book.pubdate.length >= 4) {
      let y = parseInt(book.pubdate.substring(0, 4), 10);
      let diff = currentYear - y;
      pubYearText = `${y}年発行 (${diff === 0 ? "今年" : diff + "年前"})`;
      if (diff >= 3) { isOld = true; hasOldBookWarning = true; }
    }

    // 分冊キーワード検知
    if (/(上巻|下巻|上$\vert{}下$|第\d+巻|大系|コンメンタール|分冊|[ⅠⅡⅢⅣ])/.test(book.title)) {
      hasSetKeywords = true;
    }

    const div = document.createElement("div");
    div.className = "book-item";
    div.innerHTML = `
      <div style="font-weight:bold; font-size:0.9rem; color:#f8fafc;">${idx+1}. ${book.title}</div>
      <div style="font-size:0.8rem; color:#94a3b8;">
        出版社: ${book.publisher} | 定価: ${book.price ? book.price.toLocaleString() + "円" : "不明"}
      </div>
      <div style="font-size:0.75rem; color:${isOld ? '#fbbf24' : '#94a3b8'};">
        発行: ${pubYearText} ${isOld ? '⚠️ 旧版注意' : ''}
      </div>
    `;
    container.appendChild(div);
  });

  // アラートの表示
  const alertBox = document.getElementById("alert-container");
  alertBox.innerHTML = "";
  if (hasSetKeywords && scannedBooks.length === 1) {
    alertBox.innerHTML += `<div class="alert-box">⚠️ <b>単巻・分冊注意！</b> 上下巻や全集の可能性があります。相方を探してセット化するか見送りを推奨。</div>`;
  }
  if (hasOldBookWarning && !document.getElementById("chk-latest").checked) {
    alertBox.innerHTML += `<div class="alert-box">⚠️ <b>経過年数注意！</b> 3年以上前の本が含まれています。最新版でない場合は相場が急落しているリスクがあります。</div>`;
  }

  // デフォルト仕入れ値更新 (1冊あたり550円計算)
  document.getElementById("input-cost").value = scannedBooks.length * 550;

  recalculate();
}

function recalculate() {
  if (scannedBooks.length === 0) return;

  const currentMonth = new Date().getMonth() + 1;
  const isLatest = document.getElementById("chk-latest").checked;
  const chkLine = document.getElementById("chk-line").checked;
  const chkWrite = document.getElementById("chk-write").checked;
  const chkCd = document.getElementById("chk-cd").checked;
  const chkLib = document.getElementById("chk-lib").checked;
  const chkMinor = document.getElementById("chk-minor").checked;

  let totalEstimatedSell = 0;

  scannedBooks.forEach(book => {
    // 基準残価率
    let rate = 0.40;
    for (let pub in PUB_RATES) {
      if (book.publisher.includes(pub)) {
        rate = PUB_RATES[pub];
        break;
      }
    }

    // 最新版フェイルセーフ
    if (!isLatest) {
      rate = Math.min(rate, 0.40);
    }

    // シーズン係数
    let seasonCoeff = 1.0;
    const t = book.title;
    if (t.includes("宅建") || t.includes("情報処理")) {
      if (currentMonth >= 8 && currentMonth <= 9) seasonCoeff = 1.15;
      if (currentMonth >= 10 && currentMonth <= 12) seasonCoeff = 0.35;
    } else if (t.includes("行政書士")) {
      if (currentMonth >= 9 && currentMonth <= 10) seasonCoeff = 1.15;
      if (currentMonth >= 11) seasonCoeff = 0.35;
    } else if (t.includes("看護") || t.includes("国試") || t.includes("医師") || t.includes("社会福祉士")) {
      if (currentMonth >= 12 || currentMonth <= 4) seasonCoeff = 1.15;
    }

    let itemSell = (book.price || 1500) * rate * seasonCoeff;
    totalEstimatedSell += itemSell;
  });

  // セットボーナス
  if (scannedBooks.length > 1) {
    totalEstimatedSell *= 1.1;
  }

  // コンディション減額
  if (chkCd || chkWrite) {
    totalEstimatedSell *= 0.3;
  } else {
    if (chkLine) totalEstimatedSell *= 0.75;
    if (chkLib) totalEstimatedSell *= 0.50;
    if (chkMinor) totalEstimatedSell *= 0.85;
  }

  document.getElementById("input-sell").value = Math.round(totalEstimatedSell);
  manualRecalc();
}

function manualRecalc() {
  const sell = parseFloat(document.getElementById("input-sell").value) || 0;
  const cost = parseFloat(document.getElementById("input-cost").value) || 0;
  const bookCount = scannedBooks.length;

  let shipping = 215;
  let shipName = "ゆうパケ215円";
  if (bookCount === 2) {
    shipping = 520;
    shipName = "宅急便コンパクト520円";
  } else if (bookCount >= 3) {
    shipping = 750;
    shipName = "宅急便60サイズ750円";
  }
  document.getElementById("shipping-type").textContent = shipName;
  document.getElementById("shipping-cost").textContent = `${shipping} 円`;

  // 手数料10%
  const fee = sell * 0.10;
  const profit = Math.round(sell - fee - shipping - cost);
  const profitMargin = sell > 0 ? Math.round((profit / sell) * 100) : 0;

  const profitEl = document.getElementById("profit-result");
  profitEl.textContent = `純利益: ${profit.toLocaleString()} 円 (${profitMargin}%)`;
  profitEl.className = profit >= 1000 ? "profit-display profit-plus" : "profit-display profit-minus";

  // ランク判定
  const rankEl = document.getElementById("rank-badge");
  if (profit >= 2500 && profitMargin >= 35) {
    rankEl.className = "badge-rank rank-S";
    rankEl.textContent = "S (即仕入れ/大爆益)";
  } else if (profit >= 1200 && profitMargin >= 25) {
    rankEl.className = "badge-rank rank-A";
    rankEl.textContent = "A (合格ライン/仕入れ)";
  } else if (profit >= 700) {
    rankEl.className = "badge-rank rank-B";
    rankEl.textContent = "B (微妙/薄利リスク)";
  } else if (profit > 0) {
    rankEl.className = "badge-rank rank-C";
    rankEl.textContent = "C (作業割れ)";
  } else {
    rankEl.className = "badge-rank rank-D";
    rankEl.textContent = "D (見送り/赤字)";
  }

  // メルカリURL生成（売り切れ・新しい順をダイレクト指定）
  if (scannedBooks.length > 0) {
    // 記号を除去してメインタイトルを抽出
    let cleanTitles = scannedBooks.map(b => {
      let t = b.title.replace(/[!！\.。、,\(\)（）]/g, " ").trim();
      return t.split(" ")[0];
    });
    // 重複した単語を除去
    let uniqueWords = [...new Set(cleanTitles)];
    let q = uniqueWords.join(" ");
    if (scannedBooks.length > 1) q += " セット";
    
    // status_trading_sold_out=1 と order=desc（新しい順）のみを指定
    const mercariUrl = `https://jp.mercari.com/search?keyword=${encodeURIComponent(q)}&status_trading_sold_out=1&order=desc`;
    document.getElementById("btn-mercari-link").href = mercariUrl;
  }
}

function resetAll() {
  scannedBooks = [];
  document.getElementById("books-container").innerHTML = "";
  document.getElementById("result-card").style.display = "none";
  document.getElementById("isbn-input").value = "";
  stopCamera();
}
</script>
</body>
</html>
